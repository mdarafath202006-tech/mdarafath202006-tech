  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" text-anchor="middle" fill="#8b9bb8"><text x="620" y="228"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.30;0.33;0.78;0.82;1" dur="12s" repeatCount="indefinite"/>node-0 leader: healthy</text><text x="620" y="228" fill="#f85149" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.37;0.44;0.47;1" dur="12s" repeatCount="indefinite"/>node-0 down: electing new leader</text><text x="620" y="228" fill="#39d0d8" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.49;0.65;0.68;1" dur="12s" repeatCount="indefinite"/>node-2 leader: serving traffic</text><text x="620" y="228" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.71;0.78;0.81;1" dur="12s" repeatCount="indefinite"/>node-0 recovered: rejoined</text></g>
