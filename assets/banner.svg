    <text x="40" y="108" fill="#ffffff" opacity="0">Mohamed<animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" dur="1s" begin="0.2s" fill="freeze"/></text>
    <text x="40" y="170" fill="url(#nameGrad)" opacity="0">Arafath T<animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" dur="1s" begin="0.6s" fill="freeze"/></text>
  </g>
  <rect x="40" y="188" width="14" height="4" rx="2" fill="#7ee7ff"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <g stroke="#2f81f7" stroke-opacity="0.35" stroke-width="1.5" fill="none"><path d="M520,55 L720,55"/><path d="M720,55 L755,125"/><path d="M755,125 L680,195"/><path d="M680,195 L520,175"/><path d="M520,175 L520,55"/></g>
