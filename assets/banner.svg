<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Mohamed Arafath T. An animated cluster of nodes: the leader fails, another node is elected, and the cluster recovers.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#7ee7ff"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2f81f7" fill-opacity="0.18"/></pattern>
  </defs>
  <rect width="800" height="240" rx="16" fill="url(#bg)"/><rect width="800" height="240" rx="16" fill="url(#dots)"/><rect x="0.5" y="0.5" width="799" height="239" rx="16" fill="none" stroke="#1f2a44"/>
