    <path d="M620,120 L720,55"><animate attributeName="stroke-opacity" values="0.55;0.55;0.08;0.08;0.55;0.55" keyTimes="0;0.30;0.36;0.62;0.70;1" dur="12s" repeatCount="indefinite"/></path>
    <path d="M620,120 L755,125"><animate attributeName="stroke-opacity" values="0.55;0.55;0.08;0.08;0.55;0.55" keyTimes="0;0.30;0.36;0.62;0.70;1" dur="12s" repeatCount="indefinite"/></path>
>
    <path d="M620,120 L680,195"><animate attributeName="stroke-opacity" values="0.55;0.55;0.08;0.08;0.55;0.55" keyTimes="0;0.30;0.36;0.62;0.70;1" dur="12s" repeatCount="indefinite"/></path>
    <path d="M620,120 L520,175"><animate attributeName="stroke-opacity" values="0.55;0.55;0.08;0.08;0.55;0.55" keyTimes="0;0.30;0.36;0.62;0.70;1" dur="12s" repeatCount="indefinite"/></path>
  </g>
